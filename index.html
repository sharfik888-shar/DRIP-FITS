function open3DView() {
    const container = document.getElementById('stand-3d-container');
    if(!container) return;
    container.innerHTML = '<canvas id="stand-3d-canvas"></canvas><div class="stand-hint">Крути пальцем</div>';
    const canvas = document.getElementById('stand-3d-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a24);
    const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 5);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.shadowMap.enabled = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const spot = new THREE.SpotLight(0xffffff, 1.5); spot.position.set(5, 10, 5); spot.castShadow = true; scene.add(spot);
    const point = new THREE.PointLight(0xb6ff3c, 1, 10); point.position.set(0, 0, 3); scene.add(point);

    const podium = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.1, 32), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 }));
    podium.position.y = -1; scene.add(podium);

    const mannequin = new THREE.Group();
    mannequin.add(new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1.2, 4, 16), new THREE.MeshStandardMaterial({ color: 0x333333 })));
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshStandardMaterial({ color: 0x333333 }));
    head.position.y = 1.4; mannequin.add(head);

    if(S.eq.top && IM[S.eq.top]) {
        const c = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.9, 0.6), new THREE.MeshStandardMaterial({ color: new THREE.Color(IM[S.eq.top].c1 || '#555') }));
        c.position.y = 0.3; mannequin.add(c);
    }
    if(S.eq.bot && IM[S.eq.bot]) {
        const c = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.7, 0.5), new THREE.MeshStandardMaterial({ color: new THREE.Color(IM[S.eq.bot].c1 || '#555') }));
        c.position.y = -0.5; mannequin.add(c);
    }
    scene.add(mannequin);

    // СТАТУИ В 3D
    function createStatue(x) {
        const g = new THREE.Group();
        g.add(new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0x333333 })));
        g.children[0].position.y = -0.5;
        const body = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.5, 16), new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 }));
        body.position.y = 0.25; g.add(body);
        g.position.set(x, -0.5, -1.5); scene.add(g);
    }
    createStatue(-2.5); createStatue(2.5);

    let isDrag=false, prevX=0;
    renderer.domElement.addEventListener('mousedown', e => {isDrag=true; prevX=e.offsetX});
    renderer.domElement.addEventListener('mousemove', e => {if(isDrag){mannequin.rotation.y+=(e.offsetX-prevX)*0.01;prevX=e.offsetX}});
    window.addEventListener('mouseup', () => isDrag=false);
    renderer.domElement.addEventListener('touchstart', e => {isDrag=true; prevX=e.touches[0].clientX});
    renderer.domElement.addEventListener('touchmove', e => {if(isDrag){mannequin.rotation.y+=(e.touches[0].clientX-prevX)*0.01;prevX=e.touches[0].clientX}});
    window.addEventListener('touchend', () => isDrag=false);

    function animate(){requestAnimationFrame(animate); renderer.render(scene, camera);}
    animate();
}

        fetch(SERVER_URL + '/top').then(r => r.json()).then(players => {

let isSpinning = false;
function openWheel() {
    const o = document.createElement('div'); o.className='ov';
    o.innerHTML = `<div class="pop">
        <h2>🎡 Колесо Фортуны</h2>
        <p style="color:var(--mut);margin-bottom:20px;">Испытай удачу раз в день!</p>
        <div class="wheel-container"><div class="wheel-pointer"></div><div class="wheel" id="fortune-wheel" style="transform: rotate(0deg);"></div></div>
        <button class="btn pri" id="spin-btn" style="width:100%;margin-top:10px;">Крутить (Бесплатно)</button>
        <button class="btn" onclick="this.closest('.ov').remove()" style="width:100%;margin-top:10px;">Закрыть</button>
    </div>`;
    document.body.appendChild(o);
    $('spin-btn').onclick = () => {
        if (isSpinning) return; isSpinning = true; $('spin-btn').textContent = 'Крутится...';
        const winIdx = Math.floor(Math.random() * 6);
        const rotation = 360 * 5 + (winIdx * 60) + 30; 
        $('fortune-wheel').style.transform = `rotate(${rotation}deg)`; sfx('case');
        setTimeout(() => {
            isSpinning = false; $('spin-btn').textContent = 'Крутить (Бесплатно)';
            let msg = '';
            if (winIdx === 0) { S.r += 50000; msg = '💰 +50 000 ₽!'; }
            else if (winIdx === 1) { S.xp += 100; msg = '⭐ +100 XP!'; }
            else if (winIdx === 2) { S.candy = (S.candy || 0) + 500; msg = '🍬 +500 Конфет!'; }
            else if (winIdx === 3) { S.r += 10000; S.xp += 50; msg = '💵 +10 000 ₽ и +50 XP!'; }
            else if (winIdx === 4) { S.candy = (S.candy || 0) + 200; msg = '🍬 +200 Конфет!'; }
            else if (winIdx === 5) {
                if(!S.own['h_crown']) { S.own['h_crown'] = 1; msg = '👑 ДЖЕКПОТ! Корона Вампира!'; }
                else { S.r += 500000; msg = '💰 ДЖЕКПОТ! +500 000 ₽!'; }
            }
            sfx('win'); toast(msg); save(); head(); view(); o.remove();
        }, 4000);
    };
}

        save(); head(); view(); o.remove();

    const exclusives = [{id: 'ex1', n: 'Корона Императора', e: '👑', p: 5000000, r: 3}, {id: 'ex2', n: 'Куртка "Космос"', e: '🧥', p: 3000000, r: 3}, {id: 'ex3', n: 'Часы "Бесконечность"', e: '⌚', p: 10000000, r: 3}];
    const o = document.createElement('div'); o.className='ov';
    o.innerHTML = `<div class="pop"><h2>🕵️‍♂️ Тайная лавка</h2><p style="color:var(--mut);margin-bottom:15px;">Эксклюзивные вещи!</p>${exclusives.map(item => `<div class="card" style="background:rgba(255,60,172,0.1); border-color:var(--ac2);"><div class="ic">${item.e}</div><div class="t"><b>${item.n}</b><small class="r3">Легенда</small> · <small>${fmt(item.p)} ₽</small></div><button class="btn pk" onclick="buySecretItem('${item.id}', '${item.n}', ${item.p})">Купить</button></div>`).join('')}<button class="btn" onclick="this.closest('.ov').remove()" style="width:100%;margin-top:15px;">Закрыть</button></div>`;
    document.body.appendChild(o);
}
function buySecretItem(id, name, price) {
    if (S.r < price) return toast('Не хватает рублей!');
    if (S.own[id]) return toast('У тебя уже есть эта вещь!');
    S.r -= price; S.own[id] = 1; IM[id] = {id: id, n: name, p: price, r: 3, e: '✨', t: 'top'};
    sfx('buy'); save(); head(); toast(`Куплено: ${name}`); document.querySelector('.ov')?.remove();
}

function openRobbery() {
    if (S.lastRob && new Date().toDateString() === new Date(S.lastRob).toDateString()) return toast('Ты уже грабил сегодня. Приходи завтра!');
    const victims = ['@pumpkin_king', '@ghost_girl', '@spooky_boy', '@candy_hunter', '@drill_lord'];
    const victim = victims[Math.floor(Math.random() * victims.length)];
    const o = document.createElement('div'); o.className='ov';
    o.innerHTML = `<div class="pop"><h2>🦹‍♂️ Ограбление</h2><p style="margin-bottom:20px;">Ты нашел кошелек игрока <b>${victim}</b>. Попробуешь украсть?</p><button class="btn pk" id="do-rob" style="width:100%;margin-bottom:10px;">Ограбить (Шанс 60%)</button><button class="btn" onclick="this.closest('.ov').remove()" style="width:100%;">Уйти</button></div>`;
    document.body.appendChild(o);
    $('do-rob').onclick = () => {
        S.lastRob = Date.now();
        if (Math.random() < 0.6) { const stolen = Math.floor(10000 + Math.random() * 50000); S.r += stolen; sfx('win'); toast(`УСПЕХ! Ты украл ${fmt(stolen)} ₽!`); }
        else { const fine = Math.floor(5000 + Math.random() * 10000); S.r = Math.max(0, S.r - fine); sfx('err'); toast(`ТЕБЯ ПОЙМАЛИ! Штраф: ${fmt(fine)} ₽`); }
        save(); head(); o.remove();
    };
}

function openAuction() {
    const fakeLots = [{id: 'g1', n: 'Худи "Тень"', p: 15000, seller: '@seller1'}, {id: 'g12', n: 'Кроссы "Бетон"', p: 8000, seller: '@seller2'}];
    const o = document.createElement('div'); o.className='ov';
    o.innerHTML = `<div class="pop"><h2>🏪 Аукцион игроков</h2><p style="color:var(--mut);margin-bottom:15px;">Выставляй свои вещи или покупай чужие.</p><div class="row" style="margin-bottom:15px;"><button class="btn pri" onclick="toast('Функция появится после подключения бэкенда!')" style="flex:1;">Выставить вещь</button></div><h3>Лоты на продажу</h3>${fakeLots.map(lot => `<div class="card"><div class="t"><b>${lot.n}</b><small>Продавец: ${lot.seller}</small></div><button class="btn" onclick="buyAuctionItem('${lot.id}', ${lot.p})">${fmt(lot.p)} ₽</button></div>`).join('')}<button class="btn" onclick="this.closest('.ov').remove()" style="width:100%;margin-top:15px;">Закрыть</button></div>`;
    document.body.appendChild(o);
}
function buyAuctionItem(id, price) {
    if (S.r < price) return toast('Не хватает рублей!');
    if (S.own[id]) return toast('У тебя уже есть эта вещь!');
    S.r -= price; S.own[id] = 1; sfx('buy'); save(); head(); toast('Куплено с аукциона!'); document.querySelector('.ov')?.remove();
}

function doPrestige() {
    if (S.lvl < 10) return toast('Престиж доступен только с 10 уровня!');
    const o = document.createElement('div'); o.className='ov';
    o.innerHTML = `<div class="pop"><h2>♻️ Престиж</h2><p style="margin-bottom:20px;">Ты сбросишь весь прогресс, но получишь <b>+50% к доходу навсегда</b>. Точно готов?</p><button class="btn pk" id="do-pr" style="width:100%;margin-bottom:10px;">Я готов!</button><button class="btn" onclick="this.closest('.ov').remove()" style="width:100%;">Отмена</button></div>`;
    document.body.appendChild(o);
    $('do-pr').onclick = () => {
        S.r = 0; S.lvl = 0; S.own = {}; S.eq = {}; S.xp = 0; S.prestige = (S.prestige || 0) + 1;
        sfx('lvl'); toast(`Престиж ${S.prestige}! Твой доход теперь умножается!`); save(); head(); view(); o.remove();
    };
}

head();view();
</script>
</body>
</html>
