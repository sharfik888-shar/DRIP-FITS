nav button.on{background:var(--card);border:1px solid var(--card-border);color:var(--ac);box-shadow:0 0 15px rgba(182,255,60,0.1)}

.btn.pk{background:var(--ac2);color:#fff;box-shadow:0 0 20px rgba(255,60,172,0.3);border:0}

#combo{height:20px;margin-top:10px;font-weight:900;color:var(--ac2);font-size:18px;letter-spacing:1px;text-shadow:0 0 10px var(--ac2)}

.fl{position:fixed;font-weight:900;color:var(--ac);pointer-events:none;animation:up .8s ease-out forwards;font-size:24px;z-index:60;text-shadow:0 0 10px rgba(182,255,60,0.5)}

// ФУНКЦИЯ 3D СТЕНДА
function open3DView() {
    const container = document.getElementById('stand-3d-container');
    if(!container) return;
    container.innerHTML = '<canvas id="stand-3d-canvas"></canvas><div class="stand-hint">Крути пальцем</div>';
    const canvas = document.getElementById('stand-3d-canvas');
    if (typeof THREE === 'undefined') { alert("3D не загрузился"); return; }
    
    setTimeout(() => {
        const width = canvas.clientWidth || 300;
        const height = canvas.clientHeight || 300;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a24);
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(0, 1.5, 5);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(width, height);
        
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const spot = new THREE.SpotLight(0xffffff, 1.5); spot.position.set(5, 10, 5); scene.add(spot);
        const point = new THREE.PointLight(0xb6ff3c, 1, 10); point.position.set(0, 0, 3); scene.add(point);

        const podium = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.1, 32), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 }));
        podium.position.y = -1; scene.add(podium);

        const mannequin = new THREE.Group();
        mannequin.add(new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1.2, 4, 16), new THREE.MeshStandardMaterial({ color: 0x333333 })));
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        head.position.y = 1.4; mannequin.add(head);

        if(S.eq.top && IM[S.eq.top]) {
            const c = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.9, 0.6), new THREE.MeshStandardMaterial({ color: new THREE.Color(IM[S.eq.top].c1 || '#555') }));
            c.position.y = 0.3; mannequin.add(c);
        }
        if(S.eq.bot && IM[S.eq.bot]) {
            const c = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.7, 0.5), new THREE.MeshStandardMaterial({ color: new THREE.Color(IM[S.eq.bot].c1 || '#555') }));
            c.position.y = -0.5; mannequin.add(c);
        }
        scene.add(mannequin);

        function createStatue(x) {
            const g = new THREE.Group();
            g.add(new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0x333333 })));
            g.children[0].position.y = -0.5;
            const body = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.5, 16), new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 }));
            body.position.y = 0.25; g.add(body);
            g.position.set(x, -0.5, -1.5); scene.add(g);
        }
        createStatue(-2.5); createStatue(2.5);

        let isDrag=false, prevX=0;
        renderer.domElement.addEventListener('mousedown', e => {isDrag=true; prevX=e.offsetX});
        renderer.domElement.addEventListener('mousemove', e => {if(isDrag){mannequin.rotation.y+=(e.offsetX-prevX)*0.01;prevX=e.offsetX}});
        window.addEventListener('mouseup', () => isDrag=false);
        renderer.domElement.addEventListener('touchstart', e => {isDrag=true; prevX=e.touches[0].clientX});
        renderer.domElement.addEventListener('touchmove', e => {if(isDrag){mannequin.rotation.y+=(e.touches[0].clientX-prevX)*0.01;prevX=e.touches[0].clientX}});
        window.addEventListener('touchend', () => isDrag=false);

        function animate(){requestAnimationFrame(animate); renderer.render(scene, camera);}
        animate();
    }, 100);
}

       const row2 = document.createElement('div'); row2.className = 'row';
       row2.innerHTML = `<button class="btn" onclick="openAuction()">🏪 Аукцион</button><button class="btn" onclick="doPrestige()">♻️ Престиж (${S.prestige || 0})</button>`;
       mainDiv.appendChild(row2);
   }, 50);
 }else if(tab==='shop'){
  h=shopBar()+shopList().map(i=>{const o=S.own[i.id];
   return '<div class="card"><div class="ic">'+pic(i)+'</div><div class="t"><b>'+i.n+'</b><small class="r'+i.r+'">'+RN[i.r]+'</small> · <small>'+fmt(i.p)+' ₽</small></div>'+
   '<button class="btn '+(o?'':'pri')+'" data-b="'+i.id+'" '+(o?'disabled':'')+'>'+(o?'Есть':'Купить')+'</button></div>'}).join('')+shopMore();
 }else if(tab==='top'){h=topView();
 }else if(tab==='std'){h=stand();
 }else if(tab==='cases'){
     h='<h3>Кейсы с вещами</h3>'+CASES.map((c,k)=>"<div class='card'><div class='ic'>"+c.e+"</div><div class='t'><b>"+c.n+"</b><small>"+fmt(c.p)+" ₽</small><br><small>"+c.w.map((w,r)=>w?"<span class='r"+r+"'>"+RN[r]+" "+w+"%</span>":'').join(' · ')+"</small></div><button class='btn pri' data-cs='"+k+"'>Открыть</button></div>").join('');
 }else if(tab==='wheel'){
     h = `<h3>🎡 Колесо Фортуны</h3><div class="card" style="flex-direction:column;text-align:center;padding:20px;"><div style="font-size:40px;margin-bottom:10px;">🎰</div><b>Испытай удачу!</b><small style="margin-bottom:15px;">Здесь падают Деньги, Опыт и Легендарный Скин.</small><button class="btn pk" onclick="openWheel()" style="width:100%;">Крутить колесо</button></div>
        <h3>🎲 Апгрейд вещей</h3><div class="card" style="flex-direction:column;text-align:center;padding:20px;"><div style="font-size:40px;margin-bottom:10px;">🔥</div><b>Казино вещей</b><small style="margin-bottom:15px;">Преврати дешевую вещь в дорогую.</small><button class="btn pk" onclick="openUpgrade()" style="width:100%;">Сделать Апгрейд</button></div>`;
 }else{
  h='<h3>Вещи ('+ITEMS.filter(i=>S.own[i.id]).length+'/'+ITEMS.length+')</h3><div class="grid">'+
   colList().map(i=>'<div class="cell '+(S.own[i.id]?'own':'no')+'" style="--c:var(--r'+i.r+')">'+pic(i)+i.n+'</div>').join('')+'</div>'+colMore();
 }
 m.innerHTML=h;bindList();
 const g=id=>$(id);
 if(g('tap')){
  g('tap').addEventListener('pointerdown',e=>{const now=Date.now();combo=(now-lastTap<700)?combo+1:1;lastTap=now;
   let v=tapVal();const cr=Math.random()<.06;if(cr){v*=5}
   S.r+=v;S.taps++;if(S.taps%25===0)gainXp(1);sfxClick();haptic();
   const f=document.createElement('div');f.className='fl'+(cr?' cr':'');f.textContent=(cr?'КРИТ +':'+')+fmt(v);f.style.left=(e.clientX-14)+'px';f.style.top=(e.clientY-30)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),800);
   head()});
  g('pb').addEventListener('click',()=>promo(g('pc').value.trim().toUpperCase()));
  g('up').addEventListener('click',()=>{const c=upCost();if(S.r<c){sfx('err');return toast('Не хватает рублей')}S.r-=c;S.lvl++;sfx('buy');save();head();view()});
  g('auto').addEventListener('click',()=>{const c=autoCost();if(S.r<c){sfx('err');return toast('Не хватает рублей')}S.r-=c;S.auto=(S.auto||0)+1;sfx('buy');toast('🤖 Автотап ур. '+S.auto);save();head();view()});
  g('boost').addEventListener('click',()=>{if(S.r<BOOST_COST){sfx('err');return toast('Не хватает рублей')}S.r-=BOOST_COST;S.boostUntil=Math.max(Date.now(),S.boostUntil||0)+60000;sfx('buy');toast('⚡ Доход x2 на 60 секунд!');save();head()});
  g('daily').addEventListener('click',()=>{const now=Date.now(),left=86400000-(now-S.last);if(left>0){sfx('err');return toast('Бонус через '+Math.ceil(left/3600000)+' ч')}
   S.streak=(now-S.last<172800000)?(S.streak||0)+1:1;S.last=now;const d=Math.min(S.streak,7),rw=1000*d+(S.streak%7===0?5000:0);S.r+=rw;sfx('buy');toast('🎁 День '+S.streak+': +'+fmt(rw)+' ₽ и 5 XP');gainXp(5);view()});
 }
 m.querySelectorAll('[data-b]').forEach(b=>b.addEventListener('click',()=>{const i=IM[b.dataset.b];if(S.r<i.p){sfx('err');return toast('Не хватает рублей')}
  S.r-=i.p;S.own[i.id]=1;sfx('buy');haptic();toast('Куплено: '+i.n);gainXp([1,3,8,25][i.r]);save();head();view();}));
}
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));view()});
$('main').addEventListener('click',e=>{const b=e.target.closest('[data-cs],[data-b]');if(!b)return;if(b.dataset.cs!==undefined){openCase(+b.dataset.cs)}});

const off=Math.min(7200,(Date.now()-S.t)/1000);if(off>60&&ps()>0){const g=ps()*off;S.r+=g;setTimeout(()=>toast('💤 Пока тебя не было: +'+fmt(g)+' ₽'),500)}
setInterval(()=>{S.r+=ps();S.t=Date.now();head()},1000);
setInterval(save,5000);addEventListener('pagehide',save);

// МЕХАНИКИ
const PROMOS={SHARF:{r:5000,xp:20},DRIP:{r:10000,xp:30},GLOBAL26:{r:1000000,xp:500},SORRY:{r:5000000,xp:1000}};
function promo(v){const p=PROMOS[v];if(!p){sfx('err');return toast('Такого промокода нет')}if(S.codes[v]){sfx('err');return toast('Промокод уже использован')}S.codes[v]=1;S.r+=p.r;sfx('buy');toast('✅ '+v+': +'+fmt(p.r)+' ₽');gainXp(p.xp);save();head();view()}

let isSpinning = false;
function openWheel() {
    const o = document.createElement('div'); o.className='ov';
    o.innerHTML = `<div class="pop"><h2>🎡 Колесо Фортуны</h2><div class="wheel-container"><div class="wheel-pointer"></div><div class="wheel" id="fortune-wheel" style="transform: rotate(0deg);"></div></div><button class="btn pri" id="spin-btn" style="width:100%;margin-top:10px;">Крутить</button><button class="btn" onclick="this.closest('.ov').remove()" style="width:100%;margin-top:10px;">Закрыть</button></div>`;
    document.body.appendChild(o);
    $('spin-btn').onclick = () => {
        if (isSpinning) return; isSpinning = true; $('spin-btn').textContent = 'Крутится...';
        const winIdx = Math.floor(Math.random() * 6);
        const rotation = 360 * 5 + (winIdx * 60) + 30; 
        $('fortune-wheel').style.transform = `rotate(${rotation}deg)`;
        setTimeout(() => {
            isSpinning = false; $('spin-btn').textContent = 'Крутить';
            let msg = '';
            if (winIdx === 0) { S.r += 50000; msg = '💰 +50 000 ₽!'; }
            else if (winIdx === 1) { S.xp += 100; msg = '⭐ +100 XP!'; }
            else if (winIdx === 2) { S.candy = (S.candy || 0) + 500; msg = '🍬 +500 Конфет!'; }
            else if (winIdx === 3) { S.r += 10000; S.xp += 50; msg = '💵 +10 000 ₽ и +50 XP!'; }
            else if (winIdx === 4) { S.candy = (S.candy || 0) + 200; msg = '🍬 +200 Конфет!'; }
            else if (winIdx === 5) { S.r += 500000; msg = '💰 ДЖЕКПОТ! +500 000 ₽!'; }
            sfx('win'); toast(msg); save(); head(); view(); o.remove();
        }, 4000);
    };
}

function openUpgrade() {
    const ownedItems = Object.keys(S.own).map(id => IM[id]).filter(i => i).sort((a,b) => a.p - b.p);
    if (ownedItems.length === 0) return toast('У тебя нет вещей!');
    const item = ownedItems[0]; 
    const o = document.createElement('div'); o.className='ov';
    o.innerHTML = `<div class="pop"><h2>🎲 Апгрейд вещей</h2><p style="font-size:14px; margin-bottom:20px;">Превратить <b>${item.n}</b> (${fmt(item.p)} ₽) в более дорогую?</p><div class="big" id="upg-item" style="margin: 0 auto 20px;">${pic(item)}</div><div style="background:rgba(255,0,0,0.2); padding:10px; border-radius:10px; margin-bottom:20px; font-size:12px; color:#ff8888;">При провале вещь сгорает!</div><button class="btn pk" id="do-upg" style="width:100%;margin-bottom:10px;">Апгрейд (50%)</button><button class="btn" onclick="this.closest('.ov').remove()" style="width:100%;">Отмена</button></div>`;
    document.body.appendChild(o);
    $('do-upg').onclick = () => {
        if (Math.random() > 0.5) {
            delete S.own[item.id];
            const nextTier = ITEMS.filter(i => i.p > item.p && i.p <= item.p * 2.5 && !S.own[i.id]);
            const reward = nextTier.length > 0 ? nextTier[Math.floor(Math.random() * nextTier.length)] : {n:'Деньги', p:item.p*2};
            if(reward.id) { S.own[reward.id] = 1; toast(`УСПЕХ! Выпала: ${reward.n}`); }
            else { S.r += reward.p; toast(`УСПЕХ! Выпало: ${fmt(reward.p)} ₽`); }
            sfx('win');
        } else { delete S.own[item.id]; toast(`Провал... ${item.n} сгорела.`); sfx('err'); }
        save(); head(); view(); o.remove();
    };
}

function openSecretShop() { toast('Магазин закрыт. Жди 19:00 или 03:00.'); }
function openRobbery() {
    if (S.lastRob && new Date().toDateString() === new Date(S.lastRob).toDateString()) return toast('Ты уже грабил сегодня!');
    const o = document.createElement('div'); o.className='ov';
    o.innerHTML = `<div class="pop"><h2>🦹‍♂️ Ограбление</h2><p style="margin-bottom:20px;">Попробуешь украсть деньги?</p><button class="btn pk" id="do-rob" style="width:100%;margin-bottom:10px;">Ограбить (60%)</button><button class="btn" onclick="this.closest('.ov').remove()" style="width:100%;">Уйти</button></div>`;
    document.body.appendChild(o);
    $('do-rob').onclick = () => {
        S.lastRob = Date.now();
        if (Math.random() < 0.6) { const stolen = Math.floor(10000 + Math.random() * 50000); S.r += stolen; toast(`УСПЕХ! +${fmt(stolen)} ₽!`); }
        else { const fine = Math.floor(5000 + Math.random() * 10000); S.r = Math.max(0, S.r - fine); toast(`ПОЙМАЛИ! Штраф: ${fmt(fine)} ₽`); }
        save(); head(); o.remove();
    };
}
function openAuction() { toast('Аукцион скоро появится!'); }
function doPrestige() {
    if (S.lvl < 10) return toast('Престиж с 10 уровня!');
    if(!confirm("Сбросить прогресс и получить +50% к доходу?")) return;
    S.r = 0; S.lvl = 0; S.own = {}; S.eq = {}; S.xp = 0; S.prestige = (S.prestige || 0) + 1;
    toast(`Престиж ${S.prestige}! Доход увеличен!`); save(); head(); view();
}

head();view();
</script>
</body>
</html>
