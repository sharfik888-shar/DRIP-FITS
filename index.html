#sub{font-size:12px;color:var(--mut);margin-top:2px}

main{flex:1;overflow-y:auto;padding:8px 14px 14px;position:relative;z-index:1}
nav{display:flex;gap:4px;padding:8px 8px;background:var(--card);border-radius:18px 18px 0 0;flex-wrap:wrap}

nav button.on{background:var(--card2);color:var(--ac)}
#tapw{display:flex;flex-direction:column;align-items:center;padding-top:6px}
#tap{width:210px;height:210px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#d6ff7a,var(--ac) 55%,#6aa010);color:#10130a;font-size:78px;font-weight:900;box-shadow:0 0 50px rgba(182,255,60,.35);transition:transform .06s;position:relative;touch-action:manipulation}

.fl{position:fixed;font-weight:800;color:var(--ac);pointer-events:none;animation:up .8s ease-out forwards;font-size:22px;z-index:60}
.fl.cr{color:var(--ac2);font-size:30px}

.row{display:flex;gap:8px;margin-top:10px;width:100%}
.btn{flex:1;padding:12px 8px;border:0;border-radius:14px;background:var(--card2);color:var(--fg);font-weight:700;font-size:13px}
.btn small{opacity:.8;font-weight:600}
.btn.pri{background:var(--ac);color:#10130a}.btn.pk{background:var(--ac2);color:#fff}
.btn:disabled{opacity:.4}

.ic{width:52px;height:52px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;overflow:hidden}
.card .t{flex:1;min-width:0}.card b{display:block;font-size:15px}.card small{color:var(--mut);font-size:12px}
.card .btn{flex:none;min-width:92px}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;font-size:11px;border:2px solid transparent}
.cell .e{font-size:30px;display:block;margin-bottom:4px}
.cell.no{opacity:.35;filter:grayscale(1)}
#lv{margin-top:8px;font-size:12px;color:var(--mut)}
.xpb{height:6px;background:var(--card2);border-radius:4px;margin:4px auto 0;max-width:260px;overflow:hidden}
.xpb i{display:block;height:100%;background:var(--r1)}
.inp{flex:1;min-width:0;padding:12px;border-radius:14px;border:0;background:var(--card2);color:var(--fg);font-size:14px;text-transform:uppercase;user-select:text;-webkit-user-select:text}
.fb{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}

.ic img{width:100%;height:100%;object-fit:cover}
.cell img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;margin-bottom:4px;display:block}
.artw{display:block}
.artw svg{width:100%;height:100%;display:block}
.ic .artw{width:100%;height:100%}
.cell .artw{width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;margin-bottom:4px}
.cell.own{border-color:var(--c)}
h3{margin:14px 2px 8px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.bar{height:6px;background:var(--card2);border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac2)}
.me{outline:2px solid var(--ac)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.pop{background:var(--card);border-radius:22px;padding:18px;width:100%;max-width:380px}
.pop h2{margin:0 0 12px;font-size:20px}
.pop label{display:flex;justify-content:space-between;margin:14px 0 6px;font-size:14px;color:var(--mut)}
.pop label b{color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac);height:28px}
.big{width:150px;height:150px;margin:6px auto;border-radius:20px;overflow:hidden;background:var(--card2)}
.big .artw{width:100%;height:100%}
.big img{width:100%;height:100%;object-fit:cover;display:block}
.gold{position:fixed;font-size:46px;z-index:90;filter:drop-shadow(0 0 14px #ffb02e);animation:pl .7s infinite alternate;touch-action:manipulation}
@keyframes pl{to{transform:scale(1.3) rotate(8deg)}}
.ach{opacity:.55}.ach.done{opacity:1;outline:2px solid var(--r3)}
#hw-bg{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.06;font-size:22px;line-height:1.2;overflow:hidden;white-space:pre-wrap;word-break:break-all}
#hw-warn{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#2a0f00,#3d1400);color:#ffb347;font-size:12px;font-weight:700;text-align:center;padding:8px;border-radius:12px;margin:0 0 8px}
#ctap{width:150px;height:150px;border-radius:50%;border:0;font-size:64px;margin:6px auto;display:block;background:radial-gradient(circle at 35% 30%,#ffd08a,#ff8a1c 55%,#b3560a);box-shadow:0 0 40px rgba(255,138,28,.5);touch-action:manipulation;transition:transform .06s}
#ctap:active{transform:scale(.93)}
#ctap:disabled{filter:grayscale(1);opacity:.5}
#cb{font-size:32px;font-weight:900;color:#ff8a1c;text-align:center}
.hq-done{outline:2px solid var(--ac);opacity:.7}
.hq-prog{height:5px;background:var(--card2);border-radius:3px;margin-top:6px;overflow:hidden}
.hq-prog i{display:block;height:100%;background:#ff8a1c}
</style>
</head>

  h+="<div id='hw-warn'>🎃 ХЭЛЛОУИН · до конца: "+Math.max(0,Math.ceil((HW_END-Date.now())/86400000))+" дн.</div>"+
  "<div style='text-align:center'><div id='cb'>🍬 "+fmt(S.candy)+"</div>"+
  "<button id='ctap' "+(live()?'':'disabled')+">🍬</button>"+
  "<div class='row'><button class='btn pri' data-hup='1'>Усилить конфету<br><small>+1 🍬 · "+fmt(upC())+" 🍬 (ур. "+(S.hup+1)+")</small></button></div>"+
  "<div class='row'><input id='hpc' class='inp' placeholder='Хэллоуин-промокод' autocomplete='off'><button class='btn pri' id='hpb'>Ввести</button></div></div>"+
  "<p style='color:var(--mut);font-size:12px;text-align:center'>Тапай по конфете. Шанс крита 7% (x5). Промокоды ищи в тгк 🎃</p>";
 }else if(hwT==='cases'){
  h+="<h3>Хэллоуин-кейсы (🍬 "+fmt(S.candy)+")</h3>"+HC.map((c,k)=>"<div class='card'><div class='ic'>"+c.e+"</div><div class='t'><b>"+c.n+"</b><small>"+fmt(c.p)+" 🍬</small><br><small>"+c.w.map((w,r)=>w?"<span class='r"+r+"'>"+RN[r]+" "+w+"%</span>":'').join(' · ')+"</small></div><button class='btn pri' data-hc='"+k+"' "+(live()?'':'disabled')+">Открыть</button></div>").join('')+
  "<p style='color:var(--mut);font-size:12px;text-align:center'>Открыто: "+S.hcs+". Всего хэллоуин-вещей: "+hOwn()+"/"+HI.length+"</p>";
 }else if(hwT==='scare'){
  h+="<h3>🎃 Пугало и задания (🍬 "+fmt(S.candy)+")</h3>"+
  "<div class='card'><div class='ic' style='font-size:32px'>🎃</div><div class='t'><b>Пугало</b><small>«"+SAY[Math.floor(Math.random()*SAY.length)]+"»</small></div></div>"+
  Q.map(q=>{const done=S.hq[q[0]],p=Math.min(q[3],q[4]()),full=p>=q[3];
   return "<div class='card "+(done?'hq-done':'')+"'><div class='ic'>"+(done?'✅':'📜')+"</div><div class='t'><b>"+q[1]+"</b><small>"+q[2]+" · "+p+"/"+q[3]+"</small><div class='hq-prog'><i style='width:"+(p/q[3]*100)+"%'></i></div></div><button class='btn "+(full&&!done?'pri':'')+"' data-hq='"+q[0]+"' "+(done||!full?'disabled':'')+">"+(done?'Готово':'+'+q[5]+' 🍬')+"</button></div>"}).join('');
 }else{
  h+="<h3>Хэллоуин-гардероб ("+hOwn()+"/"+HI.length+")</h3><div class='grid'>"+
  HI.map(i=>"<div class='cell "+(S.own[i.id]?'own':'no')+"' style='--c:var(--r"+i.r+")'>"+pic(i)+i.n+"</div>").join('')+
  "</div><p style='color:var(--mut);font-size:12px;text-align:center'>Надевай вещи на стенд — они дают бонус к доходу.</p>";
 }
 h+="<div class='row' style='margin-top:12px'>"+
 "<button class='btn "+(hwT==='tap'?'pri':'')+"' data-ht='tap'>🍬 Тап</button>"+
 "<button class='btn "+(hwT==='cases'?'pri':'')+"' data-ht='cases'>🎁 Кейсы</button>"+
 "<button class='btn "+(hwT==='scare'?'pri':'')+"' data-ht='scare'>🎃 Пугало</button>"+
 "<button class='btn "+(hwT==='col'?'pri':'')+"' data-ht='col'>👻 Вещи</button></div>";
 m.innerHTML=h;
 const ct=$('ctap');
 if(ct)ct.addEventListener('pointerdown',e=>{
  if(!live()){sfx('err');return toast('Ивент закончился')}
  let v=1+S.hup;const cr=Math.random()<.07;if(cr)v*=5;
  S.candy+=v;S.hclk++;cr?sfx('crit'):sfxClick();haptic();
  const f=document.createElement('div');f.className='fl'+(cr?' cr':'');f.style.color='#ff8a1c';f.textContent=(cr?'КРИТ +':'+')+v+'🍬';
  f.style.left=(e.clientX-14)+'px';f.style.top=(e.clientY-30)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),800);
  $('cb').textContent='🍬 '+fmt(S.candy);if(S.hclk%25===0){save();head()}});
 const hpb=$('hpb');if(hpb)hpb.addEventListener('click',()=>hwPromo($('hpc').value));
}

function openHCase(k){
 if(!live())return toast('Ивент закончился');
 const c=HC[k];if(S.candy<c.p){sfx('err');return toast('Не хватает конфет')}
 let x=Math.random()*100,rar=0,acc=0;for(let r=0;r<4;r++){acc+=c.w[r];if(x<acc){rar=r;break}}
 let pool=HI.filter(i=>!S.own[i.id]&&i.r===rar);
 for(let d=1;d<4&&!pool.length;d++)pool=HI.filter(i=>!S.own[i.id]&&(i.r===rar-d||i.r===rar+d));
 if(!pool.length)return toast('У тебя уже все хэллоуин-вещи 🎃');
 const it=pool[Math.floor(Math.random()*pool.length)];
 S.candy-=c.p;S.hcs++;S.own[it.id]=1;save();head();
 const o=document.createElement('div');o.className='ov';
 o.innerHTML="<div class='pop' style='text-align:center'><div class='big' id='cr'></div><div id='cn' style='margin:10px 0;font-weight:800'>Открываем…</div><button class='btn pri' id='cc' style='width:100%;display:none'>Забрать</button></div>";
 document.body.appendChild(o);sfx('case');
 let n=0;const iv=setInterval(()=>{$('cr').innerHTML=pic(HI[Math.floor(Math.random()*HI.length)]);sfx('tick');n++;
  if(n>14){clearInterval(iv);$('cr').innerHTML=pic(it);$('cr').style.boxShadow='0 0 40px var(--r'+it.r+')';
   $('cn').innerHTML="<span class='r"+it.r+"'>"+RN[it.r]+"</span><br>"+it.n+"<br><small style='color:var(--ac)'>"+fmt(it.p)+" ₽</small>";
   $('cc').style.display='block';sfx('win');haptic();gainXp([1,3,8,25][it.r]);
   $('cc').onclick=()=>{o.remove();view()}}},90)}

/* перехват view */
const _view=window.view;
window.view=function(){ if(tab==='hw'){hwView();return;} _view(); };

$('main').addEventListener('click',e=>{
 const b=e.target.closest('[data-ht],[data-hc],[data-hq],[data-hup]');if(!b||tab!=='hw')return;const d=b.dataset;
 if(d.ht){hwT=d.ht;view()}
 else if(d.hc!==undefined)openHCase(+d.hc);
 else if(d.hup){if(!live())return toast('Ивент закончился');const c=upC();if(S.candy<c){sfx('err');return toast('Не хватает конфет')}S.candy-=c;S.hup++;sfx('buy');save();view()}
 else if(d.hq){if(!live())return toast('Ивент закончился');const q=Q.find(z=>z[0]===d.hq);if(!q||S.hq[q[0]]||q[4]()<q[3])return;
  S.hq[q[0]]=1;S.candy+=q[5];sfx('ach');haptic();toast('🎃 Пугало даёт +'+fmt(q[5])+' 🍬');save();view()}
});

/* вкладка в nav */
const navEl=$('nav');
const btn=document.createElement('button');btn.dataset.t='hw';btn.textContent='🎃 Ивент';navEl.appendChild(btn);
navEl.addEventListener('click',e=>{const b=e.target.closest('button[data-t="hw"]');if(b){tab='hw';hwT='tap';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));view()}},true);

save();view();
})();
</script>
</body>
</html>
