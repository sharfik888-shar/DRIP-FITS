<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DRIP COLLECTOR</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#0c0c10;--card:#17171e;--card2:#20202a;--fg:#f4f4f6;--mut:#8b8b99;--ac:#b6ff3c;--ac2:#ff3cac;--r0:#8b8b99;--r1:#3cb4ff;--r2:#b36bff;--r3:#ffb02e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:14px 16px 8px;text-align:center}
#bal{font-size:36px;font-weight:800;color:var(--ac);letter-spacing:.5px}
#sub{font-size:12px;color:var(--mut);margin-top:2px}
#rank{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:20px;background:var(--card2);font-size:13px;font-weight:700;color:var(--ac2)}
main{flex:1;overflow-y:auto;padding:8px 14px 14px}
nav{display:flex;gap:6px;padding:8px 10px;background:var(--card);border-radius:18px 18px 0 0}
nav button{flex:1;padding:10px 0;border:0;border-radius:12px;background:transparent;color:var(--mut);font-weight:700;font-size:12px}
nav button.on{background:var(--card2);color:var(--ac)}
#tapw{display:flex;flex-direction:column;align-items:center;padding-top:10px}
#tap{width:230px;height:230px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#d6ff7a,var(--ac) 55%,#6aa010);color:#10130a;font-size:84px;font-weight:900;box-shadow:0 0 50px rgba(182,255,60,.35);transition:transform .06s;position:relative}
#tap:active{transform:scale(.94)}
.fl{position:fixed;font-weight:800;color:var(--ac);pointer-events:none;animation:up .8s ease-out forwards;font-size:22px}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.row{display:flex;gap:8px;margin-top:16px;width:100%}
.btn{flex:1;padding:12px 8px;border:0;border-radius:14px;background:var(--card2);color:var(--fg);font-weight:700;font-size:13px}
.btn.pri{background:var(--ac);color:#10130a}.btn.pk{background:var(--ac2);color:#fff}
.btn:disabled{opacity:.4}
.card{background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.ic{width:52px;height:52px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.card .t{flex:1;min-width:0}.card b{display:block;font-size:15px}.card small{color:var(--mut);font-size:12px}
.card .btn{flex:none;min-width:92px}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;font-size:11px;border:2px solid transparent}
.cell .e{font-size:30px;display:block;margin-bottom:4px}
.cell.no{opacity:.35;filter:grayscale(1)}
nav button{font-size:11px}
#lv{margin-top:8px;font-size:12px;color:var(--mut)}
.xpb{height:6px;background:var(--card2);border-radius:4px;margin:4px auto 0;max-width:260px;overflow:hidden}
.xpb i{display:block;height:100%;background:var(--r1)}
.inp{flex:1;min-width:0;padding:12px;border-radius:14px;border:0;background:var(--card2);color:var(--fg);font-size:14px;text-transform:uppercase;user-select:text;-webkit-user-select:text}
.fb{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.fb select,.fb input{flex:1 1 30%;min-width:0;padding:9px;border-radius:12px;border:0;background:var(--card2);color:var(--fg);font-size:13px;user-select:text;-webkit-user-select:text}
.ic{overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
.ic .emo{font-size:28px}
.cell img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;margin-bottom:4px;display:block}
.cell .emo{font-size:30px;display:block;margin-bottom:4px}
img.sm{width:26px;height:26px;object-fit:cover;border-radius:6px;vertical-align:middle}
.artw{display:block}
.artw svg{width:100%;height:100%;display:block}
.ic .artw{width:100%;height:100%}
.cell .artw{width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;margin-bottom:4px}
.artw.sm{display:inline-block;width:26px;height:26px;vertical-align:middle;border-radius:6px;overflow:hidden}
.cell.own{border-color:var(--c)}
h3{margin:14px 2px 8px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.bar{height:6px;background:var(--card2);border-radius:4px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac2)}
.me{outline:2px solid var(--ac)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card2);padding:10px 18px;border-radius:20px;font-size:13px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
 <header>
  <div id="bal">0 ₽</div>
  <div id="sub"></div>
  <div id="rank"></div>
  <div id="lv"></div>
 </header>
 <main id="main"></main>
 <nav id="nav">
  <button data-t="tap" class="on">👆 Тап</button>
  <button data-t="shop">🛍 Магазин</button>
  <button data-t="std">🧍 Стенд</button>
  <button data-t="col">👑 Коллекция</button>
  <button data-t="top">🏆 Топ</button>
 </nav>
</div>
<div id="toast"></div>

const IMG_DIR='img/',IMG_EXT='.jpg';

ART.jeans=`<path d='M28 14H72L78 88H54L50 42L46 88H22Z' fill='#3d5a8a'/><rect x='28' y='14' width='44' height='8' fill='#2b4268'/><path d='M50 22V42' stroke='#2b4268' stroke-width='2'/><circle cx='40' cy='32' r='2' fill='#ffd34d'/>`;

const TY=[['cap','Кепка','f',400],['cargo','Штаны','p',3000],['hood','Худи','n',2500],['bag','Сумка','f',5000],['sneak','Кроссы','p',6000],['chain','Цепь','f',8000],['shades','Очки','p',4000],['mask','Балаклава','f',1500],['puff','Пуховик','m',12000],['pack','Рюкзак','m',20000],['jack','Кожанка','f',30000],['tee','Футболка','f',800],['jeans','Джинсы','p',3500],['watch','Часы классические','p',25000],['wsport','Часы спортивные','p',9000],['wdig','Часы цифровые','p',3000],['wsmart','Смарт-часы','p',15000],['wpocket','Часы карманные','p',18000],['wchrono','Часы-хронограф','p',40000],['wskel','Часы-скелетон','p',70000],['wdiver','Часы дайверские','p',32000]];

function hs(n){let x=((n+1)*2654435761)>>>0;x^=x>>>15;x=Math.imul(x,2246822519)>>>0;x^=x>>>13;return x>>>0}
(function(){const MU=[1,2.2,5,12],EN={m:'ый',f:'ая',n:'ое',p:'ые'};let n=0;
 for(const t of TY)for(const c of COL)for(const s of (t[0][0]==='w'?STY.slice(0,5):STY)){const W=t[0][0]==='w',h=hs(n),bi=W?20+(h>>>12)%10:((h>>>12)%24<20?(h>>>12)%24:-1),B=bi>=0?BR[bi]:null,q=h%100+(B?B[3]:-8),r=q<58?0:q<84?1:q<96?2:3;let k=(h>>>16)%12;if(COL[k][1]===c[1])k=(k+5)%12;
  ITEMS.push({id:'g'+n,g:1,t:t[0],c1:c[1],c2:COL[k][1],pt:(h%7<2)?0:1+(h>>>5)%6,bi,fl:(h>>>9)&1,rt:((h>>>10)%13)-6,sc:.92+((h>>>14)%14)/100,r,p:Math.round(t[3]*MU[r]*(B?B[2]:.8)*(.8+((h>>>8)%40)/100)/10)*10,n:t[1]+(B?' '+B[0]:'')+' «'+s+'» '+c[0]+EN[t[2]]});n++}})();
function artSpan(i,c){const id='a'+i.id,fx=i.fl?-1:1,pt=(['chain','shades'].includes(i.t)||i.t[0]==='w')?0:i.pt;
 const D={1:`<pattern id='${id}p' width='12' height='12' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='12' height='12' fill='${i.c1}'/><rect width='5' height='12' fill='${i.c2}'/></pattern>`,

 const bg=['#2a2a34','#16304a','#2e1f4a','#4a3410'][i.r],rc=['','','#b36bff','#ffb02e'][i.r],bp=BP[i.t],bd=i.bi>=0&&bp?`<circle cx='${bp[0]}' cy='${bp[1]}' r='8' fill='#111' stroke='#fff' stroke-width='1.2'/><text transform='translate(${bp[0]} ${bp[1]+3}) scale(${fx} 1)' text-anchor='middle' font-size='${BR[i.bi][1].length>1?7:9}' font-weight='900' fill='#fff' font-family='Arial,sans-serif'>${BR[i.bi][1]}</text>`:'';
 return `<span class='artw ${c||''}'><svg viewBox='0 0 100 100'><defs>${D[pt]||''}</defs>${c==='nb'?'':`<rect width='100' height='100' fill='${bg}'/>`}<g transform='translate(50 50) rotate(${i.rt}) scale(${fx*i.sc} ${i.sc}) translate(-50 -50)'>${art}${bd}</g>${rc&&c!=='nb'?`<rect x='1.5' y='1.5' width='97' height='97' rx='8' fill='none' stroke='${rc}' stroke-width='3'/>`:''}</svg></span>`}

// фильтры магазина и коллекции
const shopF={c:'all',r:-1,q:'',s:1,n:30,total:0},colN={n:60};
function shopList(){const q=shopF.q.toLowerCase();const a=ITEMS.filter(i=>!S.own[i.id]&&(shopF.c==='all'||(i.t||i.id)===shopF.c)&&(shopF.r<0||i.r===shopF.r)&&(!q||i.n.toLowerCase().includes(q)));a.sort((x,y)=>(x.p-y.p)*shopF.s);shopF.total=a.length;return a.slice(0,shopF.n)}
function shopBar(){return `<div class='fb'><select id='fc'><option value='all'>Все вещи</option>${TY.map(t=>`<option value='${t[0]}'${shopF.c===t[0]?' selected':''}>${t[1]}</option>`).join('')}</select><select id='fr'><option value='-1'>Любая редкость</option>${RN.map((x,k)=>`<option value='${k}'${shopF.r===k?' selected':''}>${x}</option>`).join('')}</select><select id='fs'><option value='1'>Сначала дешёвые</option><option value='-1'${shopF.s<0?' selected':''}>Сначала дорогие</option></select><input id='fq' placeholder='Поиск' value='${shopF.q}'></div>`}
function shopMore(){return (shopF.total?'':`<p style='text-align:center;color:var(--mut)'>Ничего не найдено</p>`)+(shopF.total>shopF.n?`<button class='btn' id='more' style='width:100%'>Показать ещё (${shopF.n} из ${shopF.total})</button>`:'')}
function colList(){return ITEMS.filter(i=>S.own[i.id]).sort((a,b)=>b.p-a.p).concat(ITEMS.filter(i=>!i.g&&!S.own[i.id])).slice(0,colN.n)}
function colMore(){const o=ITEMS.filter(i=>S.own[i.id]).length+ITEMS.filter(i=>!i.g&&!S.own[i.id]).length;return o>colN.n?`<button class='btn' id='more' style='width:100%;margin-top:8px'>Показать ещё</button>`:''}
function bindList(){const g=id=>$(id);if(tab==='shop'){g('fc').onchange=e=>{shopF.c=e.target.value;shopF.n=30;view()};g('fr').onchange=e=>{shopF.r=+e.target.value;shopF.n=30;view()};g('fs').onchange=e=>{shopF.s=+e.target.value;shopF.n=30;view()};g('fq').onchange=e=>{shopF.q=e.target.value;shopF.n=30;view()}}const mo=g('more');if(mo)mo.onclick=()=>{if(tab==='shop')shopF.n+=30;else colN.n+=60;view()}}
// уровни дрипа и промокоды
const lvlOf=x=>Math.floor(Math.sqrt((x||0)/20))+1;
const xpAt=l=>20*(l-1)*(l-1);
const lvM=()=>1+.02*(lvlOf(S.xp)-1);
function gainXp(n){const a=lvlOf(S.xp);S.xp=(S.xp||0)+n;const b=lvlOf(S.xp);if(b>a){let rw=0;for(let l=a+1;l<=b;l++)rw+=l*500;S.r+=rw;setTimeout(()=>{toast('⭐ Уровень дрипа '+b+'! +'+fmt(rw)+' ₽');haptic()},1900)}save();head()}
const PROMOS={SHARF:{r:5000,xp:20}};
function promo(v){const p=PROMOS[v];if(!p)return toast('Такого промокода нет');if(S.codes[v])return toast('Промокод уже использован');S.codes[v]=1;S.r+=p.r;toast('✅ '+v+': +'+fmt(p.r)+' ₽ и '+p.xp+' XP');gainXp(p.xp);save();head();view()}
const SETS=[

 {n:'Дрил-сет',ids:['mask','cargo','bag','drill'],b:.5},
 {n:'Люкс-сет',ids:['puff','jack','grillz','shades'],b:.75}

const RANKS=[[0,'Новичок'],[3000,'Уличный'],[20000,'Дрипушник'],[80000,'Мажор'],[250000,'Король дрипа'],[1000000,'Дрип-миллионер'],[5000000,'Легенда улиц'],[20000000,'Император дрипа']];

const save=()=>{try{localStorage.setItem('drip1',JSON.stringify(S))}catch(e){}};

const colVal=()=>ITEMS.reduce((a,i)=>a+(S.own[i.id]?i.p:0),0);
const setMult=()=>1+SETS.reduce((a,s)=>a+(s.ids.every(i=>S.own[i])?s.b:0),0);
const perSec=()=>colVal()*.0006*setMult()*lvM()*eqM();
const tapVal=()=>(5+S.lvl*3)*setMult()*lvM();
const upCost=()=>Math.floor(100*Math.pow(1.55,S.lvl));
const rankOf=v=>{let r=RANKS[0][1];for(const k of RANKS)if(v>=k[0])r=k[1];return r};

function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,1700)}
function haptic(){try{tg&&tg.HapticFeedback.impactOccurred('light')}catch(e){}}

 $('bal').textContent=fmt(S.r)+' ₽';

const SM={cap:'head',mask:'head',shades:'face',chain:'neck',grillz:'neck',hood:'top',puff:'top',jack:'top',tee:'top',cargo:'bot',jeans:'bot',sneak:'shoe',drill:'shoe',bag:'bag',pack:'bag',watch:'wrist'};
const slotOf=i=>{const k=i.t||i.id;return SM[k]||(k[0]==='w'?'wrist':null)};
const PL={head:[66,0,68,68],face:[78,24,44,44],neck:[70,62,60,60],top:[40,62,120,120],bot:[56,164,88,132,1],shoe:[50,292,52,40],bag:[120,118,64,64],wrist:[14,176,40,40]};
function eqN(){return Object.keys(S.eq||{}).length}
function eqVal(){return Object.values(S.eq||{}).reduce((a,id)=>a+((ITEMS.find(x=>x.id===id)||{}).p||0),0)}
function eqM(){return 1+.03*eqN()+(eqN()>=8?.1:0)}
let topM='v',stdSlot=null,stdN=20;
function inner(i,p){const s=i.g?artSpan(i,'nb'):`<span><svg viewBox='0 0 100 100'>${ART[i.id]||''}</svg></span>`;return s.replace(/^<span[^>]*>/,'').replace('</span>','').replace('<svg ',`<svg x='${p[0]}' y='${p[1]}' width='${p[2]}' height='${p[3]}' ${p[4]?`preserveAspectRatio='none' `:''}`)}
function manSVG(){const E=S.eq||{},g=s=>E[s]?ITEMS.find(x=>x.id===E[s]):null,w=(s,m)=>{const i=g(s);if(!i)return '';const a=inner(i,PL[s]);return m?`<g transform='translate(200 0) scale(-1 1)'>${a}</g>`:a};

function stand(){const E=S.eq||{},n=eqN();
 const rows=SL.map(a=>{const k=a[0],i=E[k]?ITEMS.find(x=>x.id===E[k]):null;return `<div class='card' style='padding:8px;margin-bottom:6px;gap:6px${stdSlot===k?';outline:2px solid var(--ac)':''}'><div data-sl='${k}' style='display:flex;align-items:center;gap:8px;flex:1;min-width:0'><div class='ic' style='width:38px;height:38px;font-size:18px'>${i?pic(i):'＋'}</div><div class='t'><b style='font-size:12px'>${a[1]}</b><small style='display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>${i?i.n:'пусто'}</small></div></div>${i?`<button class='btn' data-ue='${k}' style='min-width:0;flex:none;padding:8px 10px'>✕</button>`:''}</div>`}).join('');
 let h=`<div style='display:flex;gap:10px;align-items:flex-start'><div style='flex:0 0 46%'>${manSVG()}</div><div style='flex:1;min-width:0'>${rows}</div></div><p style='text-align:center;font-size:13px;margin:10px 0 0'>Лук: <b style='color:var(--ac)'>${fmt(eqVal())} ₽</b> · слотов ${n}/8 · <b style='color:var(--ac2)'>+${Math.round((eqM()-1)*100)}% к доходу</b></p>`;

 const pill=(k,t)=>`<button class='btn ${topM===k?'pri':''}' data-tm='${k}'>${t}</button>`;
 return `<div class='row' style='margin:6px 0 4px'>${pill('v','👕 Одежда')}${pill('b','💰 Деньги')}${pill('x','⭐ Опыт')}</div><h3>Твоё место: #${pos}</h3>`+all.map((p,i)=>`<div class='card ${p[4]?'me':''}'><div class='ic'>${i<3?['🥇','🥈','🥉'][i]:i+1}</div><div class='t'><b>${p[0]}</b><small>Ур. ${lvlOf(p[3])} · ${rankOf(p[1])}</small></div><b style='color:var(--ac)'>${fmt(p[f])}${topM==='x'?' XP':' ₽'}</b></div>`).join('')+`<p style='color:var(--mut);font-size:12px;text-align:center'>Остальные игроки пока примеры. Настоящий рейтинг по @username появится с бэкендом.</p>`}
$('main').addEventListener('click',e=>{const b=e.target.closest('[data-sl],[data-eq],[data-ue],[data-tm],[data-sm]');if(!b)return;const d=b.dataset;
 if(d.sl){stdSlot=d.sl===stdSlot?null:d.sl;stdN=20;view()}
 else if(d.eq){const i=ITEMS.find(x=>x.id===d.eq);S.eq=S.eq||{};S.eq[slotOf(i)]=i.id;save();head();view();haptic();toast('Надето: '+i.n)}
 else if(d.ue){delete S.eq[d.ue];save();head();view()}
 else if(d.tm){topM=d.tm;view()}
 else if(d.sm){stdN+=20;view()}});
head();view();
</script>
